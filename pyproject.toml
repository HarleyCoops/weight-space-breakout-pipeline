[project]
name = "weight-space-breakout"
version = "0.4.2"
description = "An independent grid Breakout simulator and weight-repair benchmark"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.1", "verifiers==0.4.0; sys_platform != 'win32'"]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
prime = ["verifiers==0.4.0"]
export = ["huggingface-hub>=0.26", "safetensors>=0.4"]

[project.scripts]
weight-space-breakout = "weight_space_breakout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weight_space_breakout"]

[tool.hatch.build.targets.sdist]
include = ["weight_space_breakout", "tests", "pipeline", "deployment", "README.md", "ONE_SHOT.md", "PIPELINE.md", "FAILURE_DRIVEN.md", "PREPARED_EDITOR.md", "LANGUAGE_EXTENSION.md", "LICENSE", "pyproject.toml"]
